name: StreamAnime
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGNING_ALLOWED: 'NO'
    MARKETING_VERSION: 0.6.2
    CURRENT_PROJECT_VERSION: 8
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 13.1.1
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.7.7
targets:
  StreamAnime:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: SwiftSoup
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamanime.iphone
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StreamAnimeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: StreamAnime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamanime.iphone.tests
        GENERATE_INFOPLIST_FILE: YES
  StreamAnimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: StreamAnime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamanime.iphone.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StreamAnime
schemes:
  StreamAnime:
    build:
      targets:
        StreamAnime: all
    test:
      targets: [StreamAnimeTests, StreamAnimeUITests]
